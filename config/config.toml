# ZeroClaw Agent Configuration — Caixa Merchant Terminal

[gateway]
require_pairing = false

[agents.caixa]
name = "caixa"
description = "Solana Pay merchant payment terminal — WhatsApp channel"
model_provider = "groq.default"
model = "llama-3.1-8b-instant"
risk_profile = "default"

system_prompt = """
You are Caixa, a Solana Pay payment assistant for a small merchant.
Your job:
1. When a merchant sends a payment request (e.g. "charge table 4, 25 USDC"), 
   generate a Solana Pay link using the solana_pay_url skill.
2. Post the link back to the merchant channel with clear instructions.
3. When the payment-poll SOP reports a confirmed payment, format and send a receipt.
4. NEVER move funds. NEVER ask for private keys. NEVER sign transactions.
5. Any request to "refund", "send", "transfer", or "withdraw" MUST be routed 
   to an approval checkpoint — do not fulfill these autonomously.
6. Always declare what you are doing and why.

You have access to:
- solana_pay_url skill (constructs Solana Pay URLs)
- payment_confirm skill (interprets RPC confirmation data)
- receipt_format skill (formats merchant receipts)
- http_request tool (for Solana RPC calls and RugCheck API)
- memory (for storing pending invoices)
"""

[risk_profiles.default]
delegation_policy = { mode = "forbidden" }

[providers.models.groq.default]
# api_key is injected via ZEROCLAW_providers__models__groq__default__api_key env var
model = "llama-3.3-70b-versatile"

[secrets]
# Set secrets via environment variables — see .env.example
# GROQ_API_KEY, HELIUS_API_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN
HELIUS_API_KEY = "YOUR_HELIUS_KEY"
TWILIO_ACCOUNT_SID = "YOUR_TWILIO_SID"
TWILIO_AUTH_TOKEN = "YOUR_TWILIO_TOKEN"
TWILIO_WHATSAPP_FROM = "whatsapp:+14155238886"

[channels.whatsapp.caixa]
phone_number_id = "14155238886"
access_token = "YOUR_TWILIO_ACCESS_TOKEN"
verify_token = "zeroclaw_verify_2024"

[channels.merchant_alerts.default]
type = "webhook"
listen_port = 8081
path = "/alerts"

[memory]
backend = "sqlite"
search_mode = "bm25"
path = "./data/caixa.db"

[plugins]
enabled = true

[[plugins.tools]]
name = "solana_risk_check"
path = "./plugins/solana-risk/target/wasm32-wasip2/release/zeroclaw_solana_risk.wasm"
permissions = ["http_client", "config_read"]

[solana]
rpc_url = "https://mainnet.helius-rpc.com/?api-key=YOUR_HELIUS_API_KEY"
rpc_wss_url = "wss://mainnet.helius-rpc.com/?api-key=YOUR_HELIUS_API_KEY"
network = "mainnet"

usdc_mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
usdt_mint = "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"
merchant_address = "Fs1Ltk21cNwfrptCFxgPDgN4JfzfAZBs8BfL9QZTh9FA"
approval_threshold_usdc = 100

[sops]
directory = "./sops"

[skills]
directory = "./skills"
