[package]
name = "zeroclaw-solana-risk"
version = "0.1.0"
edition = "2021"
description = "ZeroClaw WASM plugin: Solana token risk checker using RugCheck API"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
doc = false
doctest = false

# ── WASM-only dependencies ────────────────────────────────────────────────────
# wit-bindgen and waki only needed when targeting wasm32
[target.'cfg(target_family = "wasm")'.dependencies]
# Must match the version used by zeroclaw-labs/zeroclaw (0.51 per channel-fixture)
wit-bindgen = "0.51"

# HTTP via wasi:http — blocking, no sockets
waki = { version = "0.3", features = ["component"] }

# ── Host-target dependencies (tests) ─────────────────────────────────────────
[dev-dependencies]
# No special deps needed — tests use std

[profile.release]
opt-level = "s"     # minimize binary size
lto = true
codegen-units = 1
strip = true
