[package]
name = "zeroclaw-solana-risk"
version = "0.1.0"
edition = "2021"
description = "ZeroClaw WASM plugin: Solana token risk checker using RugCheck API"
license = "MIT"

# WASM component build
[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindings — generated by wit-bindgen
wit-bindgen = "0.26"

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# HTTP via WASI (waki provides blocking wasi:http calls)
waki = "0.3"

# Base58 encoding for Solana pubkeys
bs58 = "0.5"

[dev-dependencies]
# Host-run tests (not WASM)
mockito = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = "s"    # optimize for size
lto = true
codegen-units = 1
strip = true
